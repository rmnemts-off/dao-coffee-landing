[paths]
data = /var/lib/grafana
plugins = /var/lib/grafana/plugins
provisioning = /etc/grafana/provisioning

[server]
protocol = http
http_addr = 127.0.0.1
http_port = 3000
domain = localhost
root_url = http://localhost:3000/
enforce_domain = true
router_logging = false

[security]
admin_user = dao-admin
admin_password = $__file{/etc/grafana/dao-secrets/admin-password}
secret_key = $__file{/etc/grafana/dao-secrets/secret-key}
disable_gravatar = true
# Browser -> localhost is HTTP; the remote leg is encrypted by SSH.
cookie_secure = false
cookie_samesite = strict
allow_embedding = false
disable_brute_force_login_protection = false

[users]
allow_sign_up = false
allow_org_create = false

[auth.anonymous]
enabled = false

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
feedback_links_enabled = false

[plugins]
plugin_admin_enabled = false
preinstall_disabled = true

[snapshots]
external_enabled = false

[smtp]
enabled = false

[unified_alerting]
enabled = false

[live]
max_connections = 0

[log]
mode = console
level = warn

[dashboards]
min_refresh_interval = 30s
default_home_dashboard_path = /var/lib/grafana/dashboards/dao-host.json
