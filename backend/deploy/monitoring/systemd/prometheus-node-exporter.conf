[Unit]
StartLimitIntervalSec=300
StartLimitBurst=3

[Service]
ExecStart=
ExecStart=/usr/bin/prometheus-node-exporter --web.listen-address=127.0.0.1:9100 --collector.disable-defaults --collector.cpu --collector.meminfo --collector.filesystem --collector.loadavg --collector.netdev --collector.stat --collector.time --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run)($$|/) --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|mqueue|nsfs|overlay|proc|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs|tmpfs)$$ --log.level=warn
Restart=on-failure
RestartSec=10
TimeoutStopSec=15
MemoryHigh=48M
MemoryMax=96M
CPUWeight=25
NoNewPrivileges=true
ProtectSystem=strict
ProtectHome=true
PrivateTmp=true
StandardOutput=journal
StandardError=journal
LogRateLimitIntervalSec=30s
LogRateLimitBurst=50
