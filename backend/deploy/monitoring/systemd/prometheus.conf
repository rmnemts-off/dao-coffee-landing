[Unit]
StartLimitIntervalSec=300
StartLimitBurst=3

[Service]
ExecStart=
ExecStart=/usr/bin/prometheus --config.file=/etc/prometheus/dao-prometheus.yml --storage.tsdb.path=/var/lib/prometheus/dao-metrics --storage.tsdb.retention.time=3d --storage.tsdb.retention.size=1GB --web.listen-address=127.0.0.1:9090 --web.external-url=http://localhost:9090 --web.enable-admin-api=false --web.enable-lifecycle=false --log.level=warn
Restart=on-failure
RestartSec=10
TimeoutStopSec=30
MemoryHigh=256M
MemoryMax=384M
CPUWeight=25
NoNewPrivileges=true
ProtectSystem=strict
ProtectHome=true
PrivateTmp=true
ReadWritePaths=/var/lib/prometheus/dao-metrics
StandardOutput=journal
StandardError=journal
LogRateLimitIntervalSec=30s
LogRateLimitBurst=50
