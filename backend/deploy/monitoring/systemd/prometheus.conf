[Unit]
StartLimitIntervalSec=300
StartLimitBurst=3

[Service]
ExecStart=
# Admin/lifecycle endpoints stay disabled by default. Ubuntu's Kingpin parser
# rejects --web.enable-*=false; validate.sh checks the effective runtime flags.
ExecStart=/usr/bin/prometheus --config.file=/etc/prometheus/dao-prometheus.yml --storage.tsdb.path=/var/lib/prometheus/dao-metrics --storage.tsdb.retention.time=3d --storage.tsdb.retention.size=1GB --web.listen-address=127.0.0.1:9090 --web.external-url=http://localhost:9090 --log.level=warn
Restart=on-failure
RestartSec=10
TimeoutStopSec=30
MemoryHigh=96M
MemoryMax=192M
CPUWeight=25
NoNewPrivileges=true
ProtectSystem=strict
ProtectHome=true
PrivateTmp=true
ReadWritePaths=/var/lib/prometheus/dao-metrics
StandardOutput=journal
StandardError=journal
LogRateLimitIntervalSec=30s
LogRateLimitBurst=50
