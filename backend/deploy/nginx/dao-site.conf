# Include only in the HTTPS server. Never use the repository as the root.
root /srv/dao-coffee/current/site;
index index.html;

include /etc/nginx/snippets/dao-private-locations.conf;

location = /api/leads {
    error_page 413 = @dao_body_too_large;
    proxy_pass http://127.0.0.1:4322;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    # This must overwrite, not append to, the visitor-supplied header.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Forwarded "";
    proxy_next_upstream off;
    proxy_intercept_errors off;
    proxy_connect_timeout 3s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    # Stream the small request to Node's own size / total-read-time checks.
    # No request/response body is persisted in nginx proxy temporary files.
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_max_temp_file_size 0;
}

location @dao_body_too_large {
    default_type application/json;
    add_header Cache-Control no-store always;
    add_header X-Content-Type-Options nosniff always;
    return 413 '{"ok":false,"code":"BODY_TOO_LARGE"}';
}

location = /api { return 404; }
location ^~ /api/ { return 404; }

location = /404.html {
    internal;
    add_header Cache-Control no-cache;
    add_header X-Content-Type-Options nosniff always;
}

location / {
    error_page 404 /404.html;
    # File names are not content-hashed; browsers should revalidate updates.
    add_header Cache-Control no-cache;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri $uri/ =404;
}
