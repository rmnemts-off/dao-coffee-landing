# Include inside each DAO server {} block.
server_tokens off;
access_log /var/log/nginx/dao-access.log dao_safe buffer=32k flush=5s;
# nginx's ordinary error log may include the request URI, client IP and query.
# Deliberately discard request error logs; diagnose using safe status summaries.
error_log /dev/null;
log_not_found off;

client_max_body_size 8k;
client_body_buffer_size 16k;
client_header_timeout 20s;
client_body_timeout 20s;
send_timeout 30s;
keepalive_timeout 30s;
autoindex off;
add_header X-Content-Type-Options nosniff always;
