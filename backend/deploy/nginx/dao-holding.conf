# Fresh-server HTTP holding response before the canonical domain is confirmed.
# Enable this OR a domain-specific DAO template, never both.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    include /etc/nginx/snippets/dao-server-defaults.conf;
    include /etc/nginx/snippets/dao-private-locations.conf;

    # No document root, ACME challenge or API upstream is exposed at this stage.
    # Keep the return inside location so private-path rules still produce 404.
    location / {
        default_type text/plain;
        add_header Cache-Control no-store always;
        add_header Retry-After 300 always;
        add_header X-Content-Type-Options nosniff always;
        return 503 "Service temporarily unavailable.\n";
    }
}
