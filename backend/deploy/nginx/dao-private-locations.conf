# Monitoring uses loopback listeners / SSH tunnels, never this public vhost.
location ~* ^/(healthz|readyz|livez|metrics|nginx_status|stub_status|grafana|prometheus|loki)(/|$) {
    return 404;
}

# The ^~ ACME location is the only exception for a dot-prefixed path.
location ~ (^|/)\. {
    return 404;
}
