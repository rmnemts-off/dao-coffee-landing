# Include exactly once inside nginx's http {} context, before the server files.
# Only fixed route labels and server-generated measurements are recorded.
map $uri $dao_route {
    default static;
    /api/leads leads;
    ~^/\.well-known/acme-challenge/ acme;
    ~*^/(healthz|readyz|livez|metrics|nginx_status|stub_status|grafana|prometheus|loki)(/|$) private;
}

log_format dao_safe escape=json
    '{"time":"$time_iso8601","route":"$dao_route","status":$status,'
    '"bytes":$body_bytes_sent,"seconds":$request_time,'
    '"upstream_status":"$upstream_status","upstream_seconds":"$upstream_response_time"}';
