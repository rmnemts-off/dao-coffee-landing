# Public visual review by IP before DNS and HTTPS are configured.
# Never proxy forms to a live transport in this temporary HTTP configuration.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    include /etc/nginx/snippets/dao-server-defaults.conf;
    include /etc/nginx/snippets/dao-private-locations.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;

    root /srv/dao-coffee/current/site;
    index index.html;

    location = /api/leads {
        default_type application/json;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 503 '{"ok":false,"code":"DELIVERY_UNAVAILABLE"}';
    }

    location = /api { return 404; }
    location ^~ /api/ { return 404; }
    location = /design-system { return 404; }
    location ^~ /design-system/ { return 404; }

    location / {
        add_header Cache-Control no-cache;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ =404;
    }
}
